# CRPS paper experiments (rcGAN MRI). Same as configs/mri.yml except paths, the cached data module,
# and the reduced budget (identical for R, F, MS). See ~/crps_review/reports/05_mri.md.
checkpoint_dir: "/share/gpu0/jjwhit/crps_review/paper/mri/ckpt/"
data_path: "/share/gpu0/tl3/fastMRI_dataset"
sense_maps_path: "/share/gpu0/jjwhit/crps_review/paper/mri/maps/"

experience: mri

# MRI Args
num_of_top_slices: 8
use-middle-slices: false
calib_width: 16
R: 8

# Number of code vectors for each phase
num_z_test: 32
num_z_valid: 8
num_z_train: 2

# Data
in_chans: 16
out_chans: 16
im_size: 384
num_workers: 6

# Number of virtual coils
num_coils: 8

# Optimizer:
lr: 0.001
beta_1: 0
beta_2: 0.99

# Loss weights
gp_weight: 10
adv_weight: 1e-5
# adversarial weight 1e-2 up to epoch adv_epochs[0], 1e-4 up to adv_epochs[1], then 1e-5
# (repo: [4, 22] of 100 epochs; scaled to the same fractions of the reduced budget)
adv_epochs: [1, 8]

# Training
batch_size: 2
num_epochs: 40
psnr_gain_tol: 0.25
keep_checkpoints: 3
n_train_volumes: 360
